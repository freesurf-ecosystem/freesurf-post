<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <clipPath id="ball">
      <circle cx="50" cy="50" r="45"/>
    </clipPath>
    <pattern id="yarn-top" width="4.5" height="4.5" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
      <line x1="0" y1="0" x2="0" y2="4.5" stroke="#000000" stroke-width="2.3"/>
    </pattern>
    <pattern id="yarn-bottom" width="4.5" height="4.5" patternUnits="userSpaceOnUse" patternTransform="rotate(-38)">
      <line x1="0" y1="0" x2="0" y2="4.5" stroke="#000000" stroke-width="2.3"/>
    </pattern>
  </defs>
  <g clip-path="url(#ball)">
    <rect x="0" y="0" width="100" height="50" fill="url(#yarn-top)"/>
    <rect x="0" y="50" width="100" height="50" fill="url(#yarn-bottom)"/>
    <g fill="none" stroke="#000000" stroke-width="2.3" opacity="0.85">
      <path d="M 8 38 C 30 20, 70 20, 92 38"/>
      <path d="M 8 62 C 30 80, 70 80, 92 62"/>
      <path d="M 32 8 C 20 30, 20 70, 32 92"/>
      <path d="M 68 8 C 80 30, 80 70, 68 92"/>
    </g>
  </g>
  <circle cx="50" cy="50" r="45" fill="none" stroke="#000000" stroke-width="5"/>
  <path d="M 50 5 C 55 0.5, 63 1, 69 8" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
</svg>
