name = "freesurf-to-post"
main = "src/index.ts"
compatibility_date = "2024-12-01"

# Routing is via the custom domain post.freesurf.tools (set in the Cloudflare
# dashboard → Workers → Domains & Routes), so no `routes` block is needed here.

# Static dashboard (landing + compose UI) served from ./dashboard
[assets]
directory = "./dashboard"
binding = "ASSETS"
not_found_handling = "single-page-application"

# KV for rate limiting counters
[[kv_namespaces]]
binding = "RATE_LIMITS"
id = "0a83c67d64d5484e96cb732f64e19c89"

# Cron: process due scheduled posts every 5 minutes
[triggers]
crons = ["*/5 * * * *"]

[vars]
ENVIRONMENT = "production"

# Observability — capture Worker logs (console.*) so proxy errors are visible.
# Mirrors the Cloudflare dashboard settings so deployments stay consistent.
[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
