name = "freesurf-to-post"
main = "src/index.ts"
compatibility_date = "2024-12-01"

# NOTE: this account is on the Cloudflare Free plan (no [limits] overrides —
# subrequests stay at the 50 default; the analytics refresh enforces its own budget).

# Custom domain. post.freesurf.tools serves both the API and the dashboard UI.
routes = [
  { pattern = "post.freesurf.tools", custom_domain = true },
]

# Static dashboard (landing + compose UI) served from ./dashboard
[assets]
directory = "./dashboard"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

# KV for rate limiting counters
[[kv_namespaces]]
binding = "RATE_LIMITS"
id = "0a83c67d64d5484e96cb732f64e19c89"

# Cron: process due scheduled posts every 5 minutes
[triggers]
crons = ["*/5 * * * *"]

[vars]
ENVIRONMENT = "production"
REVIEWER_EMAILS = "reviewer@freesurf.tools"
DIRECT_CONNECT_PLATFORMS = "linkedin,facebook,instagram,threads,tiktok,pinterest,youtube"
POST_DAILY_PER_USER = "300"
POST_MONTHLY_PER_ACCOUNT = "500"
POST_MONTHLY_PER_USER = "500"
POST_MONTHLY_GLOBAL = "9000"

# Direct media (reviewer/sandbox scaffold). Disabled by default; the Bundle
# upload path stays active. To enable:
#   1. npx wrangler r2 bucket create freesurf-post-media
#   2. Uncomment the [[r2_buckets]] binding below
#   3. Set MEDIA_DIRECT_ENABLED = "1"
#   4. Optional: MEDIA_PUBLIC_BASE = "https://media.example.com"
MEDIA_DIRECT_ENABLED = "1"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
# Legacy bucket name retained to avoid migrating existing media objects.
bucket_name = "catvideo-media"
FACEBOOK_CLIENT_ID = "1013002711832420"
FACEBOOK_REDIRECT_URI = "https://post.freesurf.tools/api/oauth/meta/callback"
META_CONFIG_ID = "1471152441532955"
THREADS_CLIENT_ID = "995653886194880"
THREADS_REDIRECT_URI = "https://post.freesurf.tools/api/oauth/threads/callback"
TIKTOK_REDIRECT_URI = "https://post.freesurf.tools/api/oauth/tiktok/callback"

# Observability — capture Worker logs (console.*) so proxy errors are visible.
# Mirrors the Cloudflare dashboard settings so deployments stay consistent.
[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
